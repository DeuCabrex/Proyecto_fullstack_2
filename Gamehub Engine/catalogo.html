<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | GameHub Store</title>
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

    <header class="encabezado-principal">
        <div class="logo">
            <img src="gamehub.png" alt="Logo GH">
        </div>
        <h1>GameHub Store</h1>
        <nav class="navegacion-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html" class="activo">Catálogo</a></li>
                <li><a href="mis-ordenes.html">Órdenes</a></li>
                <li><a href="carrito.html">🛒 (<span id="contador-carrito">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-catalogo">
        <h2>Catálogo de Productos</h2>

        <div class="layout-catalogo">
            <aside class="panel-filtros">
                <h3>Filtros</h3>
                
                <form id="form-filtros">
                    <div class="grupo-filtro">
                        <label for="filtro-categoria">Categoría</label>
                        <select id="filtro-categoria" name="categoria">
                            <option value="todas">Todas</option>
                            <option value="notebooks">Notebooks</option>
                            <option value="gpu">Tarjetas Gráficas</option>
                            <option value="procesadores">Procesadores</option>
                            <option value="perifericos">Periféricos</option>
                        </select>
                    </div>

                    <!-- Filtro Marca -->
                    <div class="grupo-filtro">
                        <label for="filtro-marca">Marca</label>
                        <select id="filtro-marca" name="marca">
                            <option value="todas">Todas</option>
                            <option value="Asus">Asus</option>
                            <option value="Nvidia">Nvidia</option>
                            <option value="AMD">AMD</option>
                            <option value="Logitech">Logitech</option>
                        </select>
                    </div>

                    <div class="grupo-filtro">
                        <label for="precio-min">Precio Mínimo ($)</label>
                        <input type="number" id="precio-min" placeholder="0" min="0">
                    </div>

                    <div class="grupo-filtro">
                        <label for="precio-max">Precio Máximo ($)</label>
                        <input type="number" id="precio-max" placeholder="2000000" min="0">
                    </div>

                    <span id="error-precio" class="mensaje-error" aria-live="polite"></span>

                    <button type="submit" class="boton-secundario">Aplicar Filtros</button>
                    <button type="button" id="btn-limpiar" class="boton-terciario">Limpiar Filtros</button>
                </form>
            </aside>

            <section class="seccion-productos">
                <div class="barra-ordenamiento">
                    <label for="ordenar-por">Ordenar por:</label>
                    <select id="ordenar-por">
                        <option value="destacados">Destacados</option>
                        <option value="precio-asc">Precio: Menor a Mayor</option>
                        <option value="precio-desc">Precio: Mayor a Menor</option>
                        <option value="nombre-asc">Nombre: A-Z</option>
                    </select>
                </div>

                <div id="grilla-productos" class="grilla-productos"></div>
            </section>
        </div>
    </main>

    <footer class="pie-pagina">
        <p>&copy; 2026 GameHub Store - Proyecto Desarrollo FullStack II</p>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
