<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub Store - Catálogo</title>
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
    <header class="encabezado-principal">
        <div class="logo">
            <img src="gamehub.png" alt="Logo GameHub" class="logo-imagen">
        </div>
        <h1 class="titulo-central">GameHub Store</h1>
        <nav class="navegacion-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html" class="activo">Catálogo</a></li>
                <li><a href="ordenes.html">Órdenes</a></li>
                <li><a href="carrito.html">🛒 <span id="contador-carrito">(0)</span></a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-catalogo">
        <h2>Catálogo de Productos</h2>
        
        <div class="barra-ordenamiento">
            <label>Ordenar por:</label>
            <select id="ordenar">
                <option value="destacados">Destacados</option>
                <option value="menor-precio">Menor Precio</option>
                <option value="mayor-precio">Mayor Precio</option>
            </select>
        </div>

        <div class="layout-catalogo">
            <aside class="panel-filtros">
                <h3>Filtros</h3>
                
                <div class="grupo-filtro">
                    <label>Categoría</label>
                    <select id="filtro-categoria">
                        <option value="todas">Todas</option>
                        <option value="perifericos">Periféricos</option>
                        <option value="notebooks">Notebooks</option>
                        <option value="gpu">Tarjetas de Video</option>
                        <option value="procesadores">Procesadores</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label>Marca</label>
                    <select id="filtro-marca">
                        <option value="todas">Todas</option>
                        <option value="hyperx">HyperX</option>
                        <option value="logitech">Logitech</option>
                        <option value="asus">Asus</option>
                        <option value="nvidia">Nvidia</option>
                        <option value="amd">AMD</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label>Precio Mínimo ($)</label>
                    <input type="number" id="precio-min" value="0">
                </div>

                <div class="grupo-filtro">
                    <label>Precio Máximo ($)</label>
                    <input type="number" id="precio-max" value="2000000">
                </div>

                <button id="btn-aplicar" class="boton-secundario">Aplicar Filtros</button>
                <button id="btn-limpiar" class="boton-terciario">Limpiar Filtros</button>
            </aside>

            <section class="grilla-productos" id="grilla-productos">
            </section>
        </div>
    </main>
    <footer class="pie-pagina">
        <p>&copy; 2026 GameHub Store - Proyecto Desarrollo FullStack II</p>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
