<!-- MODAL PARA ESCRIBIR RESEÑA -->
<div id="modal-resena" class="modal-overlay hidden">
    <div class="modal-contenido">
        <h3>Escribir Reseña</h3>
        <p id="modal-resena-producto" class="subtitulo-modal"></p>
        
        <form id="form-resena" onsubmit="guardarResena(event)">
            <input type="hidden" id="resena-orden-id">
            <input type="hidden" id="resena-producto-id">

            <div class="campo-form">
                <label for="puntuacion">Puntuación:</label>
                <select id="puntuacion" required>
                    <option value="">Selecciona una nota</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>
            </div>

            <div class="campo-form">
                <label for="comentario-resena">Comentario:</label>
                <textarea id="comentario-resena" rows="4" placeholder="Escribe tu opinión sobre el producto..." required></textarea>
                <span id="error-comentario" class="mensaje-error"></span>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" onclick="cerrarModales()">Cancelar</button>
                <button type="submit" class="btn-banner">Publicar Reseña</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL PARA SOLICITAR GARANTÍA -->
<div id="modal-garantia" class="modal-overlay hidden">
    <div class="modal-contenido">
        <h3>Solicitud de Garantía</h3>
        <p id="modal-garantia-producto" class="subtitulo-modal"></p>
        
        <form id="form-garantia" onsubmit="guardarGarantia(event)">
            <input type="hidden" id="garantia-orden-id">

            <div class="campo-form">
                <label for="motivo-garantia">Motivo de la falla o solicitud:</label>
                <textarea id="motivo-garantia" rows="4" placeholder="Describe detalladamente el fallo del producto..." required></textarea>
                <span id="error-garantia" class="mensaje-error"></span>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" onclick="cerrarModales()">Cancelar</button>
                <button type="submit" class="btn-banner">Enviar Solicitud</button>
            </div>
        </form>
    </div>
</div>
