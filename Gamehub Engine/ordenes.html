<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub Store - Mis Órdenes</title>
    <link rel="stylesheet" href="CSS/mis_ordenes_css.css">
</head>
<body>
    <header class="header-principal">
        <div class="header-logo">
            <img src="imagenes/gamehub.png" alt="Logo GameHub Store">
        </div>
        <h1 class="header-titulo">GameHub Store</h1>
        <nav class="header-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="ordenes.html" class="activo">Órdenes</a></li>
                <li><a href="carrito.html">🛒 (0)</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-ordenes">
        <section class="encabezado-seccion">
            <h2>Mis Órdenes</h2>
            <p>Revisa el estado de tus compras e historial de pedidos.</p>
        </section>

        <section class="lista-ordenes">
        </section>
    </main>
    <div id="modal-detalles" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#1a1d24; border:1px solid #2a2e3d; border-radius:10px; padding:2rem; max-width:550px; width:90%; color:#fff; position:relative; box-shadow: 0 5px 20px rgba(0,0,0,0.5);">
            <span id="cerrar-modal-detalles" style="position:absolute; top:12px; right:18px; font-size:1.8rem; cursor:pointer; color:#aaa;">&times;</span>
            <h3 style="color:#00e676; margin-bottom:1rem; border-bottom:1px solid #2a2e3d; padding-bottom:0.5rem;">Detalles de la Compra</h3>
            <div id="contenido-modal-detalles"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GameHub Store - Todos los derechos reservados.</p>
    </footer>

    <script src="js/ordenes.js"></script>
</body>
</html>
