<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub Store - Reseñas y Soporte</title>
        <link rel="stylesheet" href="CSS/mis_ordenes_css.css">
</head>
<body>
    <header class="header-principal">
        <div class="header-logo">
            <img src="imagenes/gamehub.png" alt="Logo GameHub Store">
        </div>
        
        <h1 class="header-titulo">GameHub Store</h1>
        
        <nav class="header-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="ordenes.html" class="activo">Órdenes</a></li>
                <li><a href="carrito.html">🛒 (0)</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenedor-ordenes">
        <section class="encabezado-seccion">
            <h2>Centro de Reseñas y Soporte</h2>
            <p>Déjanos tu opinión sobre el producto o solicita ayuda de garantía.</p>
        </section>

        <section class="lista-ordenes">
        <article class="tarjeta-orden">
                <header class="orden-header">
                    <span class="orden-id">⭐ Escribir Reseña</span>
                </header>

                <div class="orden-body">                    
                    <form id="form-resena" onsubmit="guardarResena(event)">
                        <input type="hidden" id="resena-orden-id">
                        <input type="hidden" id="resena-producto-id">
            
                        <div class="campo-form">
                            <label for="puntuacion">Puntuación:</label>
                            <select id="puntuacion" required>
                                <option value="">Selecciona una nota</option>
                                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                <option value="3">⭐⭐⭐ (3/5)</option>
                                <option value="2">⭐⭐ (2/5)</option>
                                <option value="1">⭐ (1/5)</option>
                            </select>
                        </div>
            
                        <div class="campo-form">
                            <label for="comentario-resena">Comentario:</label>
                            <textarea id="comentario-resena" rows="4" placeholder="Escribe tu opinión sobre el producto..." required></textarea>
                            <span id="error-comentario" class="mensaje-error"></span>
                        </div>
            
                        <div class="modal-acciones">
                            <button type="button" class="btn-cancelar" onclick="window.location.href='ordenes.html'">Volver</button>
                            <button type="submit" class="btn-banner">Publicar Reseña</button>
                        </div>
                    </form>
                </div>
            </article>
        </section>
    </main>
    <footer>
        <p>© 2026 GameHub Store - Proyecto Desarrollo FullStack II</p>
    </footer>

</body>
</html>
